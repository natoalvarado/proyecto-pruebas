name: CD - Despliegue y Rollback

on:
  push:
    branches:
      - feature/examen-final
  workflow_dispatch:

jobs:
  deployment:
    name: Despliegue en ambiente de pruebas
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el proyecto
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: proyecto-pruebas/pom.xml

      # 3. Compilar y ejecutar pruebas
      - name: Build y pruebas automatizadas
        working-directory: proyecto-pruebas
        run: mvn --batch-mode clean verify

      # 4. Ejecutar prueba de aceptación
      - name: Acceptance Test
        working-directory: proyecto-pruebas
        run: |
          java -cp target/classes com.pruebas.App | tee acceptance.log
          grep -q "ACEPTACION_OK" acceptance.log

      # 5. Preparar ambiente de pruebas
      - name: Preparar ambiente QA
        run: |
          mkdir -p ambiente-qa/releases
          mkdir -p ambiente-qa/backup

          echo "Ambiente QA preparado correctamente"

      # 6. Recuperar versión estable
      - name: Preparar version estable para rollback
        run: |
          git worktree add /tmp/version-estable v1.0.0

          cd /tmp/version-estable/proyecto-pruebas

          mvn --batch-mode clean package -DskipTests

          cp target/*.jar \
            "$GITHUB_WORKSPACE/ambiente-qa/backup/version-estable.jar"

          echo "Version estable v1.0.0 respaldada"

      # 7. Desplegar nueva versión
      - name: Desplegar nueva version
        run: |
          cp proyecto-pruebas/target/*.jar \
            ambiente-qa/releases/aplicacion.jar

          echo "Nueva version desplegada en QA"

          ls -lh ambiente-qa/releases/

      # 8. Verificar despliegue
      - name: Verificar aplicacion desplegada
        run: |
          java -cp ambiente-qa/releases/aplicacion.jar \
            com.pruebas.App | tee despliegue.log

          grep -q "ACEPTACION_OK" despliegue.log

          echo "Despliegue verificado correctamente"

      # 9. Simular un problema y ejecutar rollback
      - name: Simular fallo y ejecutar rollback
        run: |
          echo "SIMULACION: Se detecta un problema posterior al despliegue"

          echo "Iniciando rollback..."

          cp ambiente-qa/backup/version-estable.jar \
            ambiente-qa/releases/aplicacion.jar

          echo "Version estable restaurada"

      # 10. Verificar recuperación
      - name: Verificar rollback
        run: |
          java -cp ambiente-qa/releases/aplicacion.jar \
            com.pruebas.App | tee rollback.log

          grep -q "ACEPTACION_OK" rollback.log

          cmp ambiente-qa/backup/version-estable.jar \
              ambiente-qa/releases/aplicacion.jar

          echo "ROLLBACK_OK"
          echo "Aplicacion restaurada correctamente"